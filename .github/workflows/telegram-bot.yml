name: Telegram → GitHub file bot

on:
  schedule:
    # GitHub's minimum interval. Scheduled runs can be delayed a few minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-github-bot
  cancel-in-progress: false

jobs:
  poll:
    name: Poll Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll Telegram and upload files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MINUTES: "4.5"
        run: node bot.js

      - name: Persist polling offset
        if: always()
        run: |
          if [ -n "$(git status --porcelain .bot-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .bot-state.json
            git commit -m "chore: advance Telegram offset [skip ci]"
            git push
          fi
